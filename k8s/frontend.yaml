apiVersion: apps/v1
kind: Deployment
metadata:
  name: storybook-ui
  namespace: default
  labels:
    app: storybook-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storybook-ui
  template:
    metadata:
      labels:
        app: storybook-ui
    spec:
      containers:
        - name: frontend
          image: REGION-docker.pkg.dev/PROJECT_ID/storybook-images/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: storybook-ui
  namespace: default
spec:
  selector:
    app: storybook-ui
  ports:
    - port: 80
      targetPort: 80
