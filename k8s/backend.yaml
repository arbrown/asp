apiVersion: v1
kind: ServiceAccount
metadata:
  name: storybook-backend
  namespace: default
  annotations:
    # Workload Identity — binds to the GCP SA created by Terraform
    iam.gke.io/gcp-service-account: storybook-backend@${GCP_PROJECT_ID}.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storybook-backend
  namespace: default
  labels:
    app: storybook-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storybook-backend
  template:
    metadata:
      labels:
        app: storybook-backend
    spec:
      serviceAccountName: storybook-backend
      containers:
        - name: backend
          image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/storybook-images/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: GCP_PROJECT_ID
              value: "${GCP_PROJECT_ID}"
            - name: GCP_REGION
              value: "${GCP_REGION}"
            - name: GCS_ARTIFACTS_BUCKET
              value: "${GCS_ARTIFACTS_BUCKET}"
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "1"
            - name: GOOGLE_CLOUD_PROJECT
              value: "${GCP_PROJECT_ID}"
            - name: GOOGLE_CLOUD_LOCATION
              value: "global"
            - name: RQLITE_URL
              value: "http://rqlite.default.svc.cluster.local:4001"
            - name: SUBSTRATE_ENABLED
              value: "true"
            - name: SUBSTRATE_API_ADDR
              value: "api.ate-system.svc:443"
            - name: SUBSTRATE_ATESPACE
              value: "asp"
            - name: SUBSTRATE_TEMPLATE
              value: "asp-runner"
            - name: SUBSTRATE_CA_FILE
              value: "/run/servicedns-ca/ca.crt"
            - name: SUBSTRATE_CRED_BUNDLE
              value: "/run/podidentity.podcert.ate.dev/credential-bundle.pem"
            - name: DEV_AUTH_ENABLED
              value: "0"
            - name: LEGACY_OWNER_EMAIL
              value: "${LEGACY_OWNER_EMAIL}"
            - name: DEV_DEFAULT_EMAIL
              value: "${DEV_DEFAULT_EMAIL}"
          volumeMounts:
            - name: servicedns-ca
              mountPath: /run/servicedns-ca
              readOnly: true
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: servicedns-ca
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: ca.crt
        - name: podidentity
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: storybook-backend
  namespace: default
  annotations:
    cloud.google.com/backend-config: '{"default": "storybook-backend-config"}'
spec:
  selector:
    app: storybook-backend
  ports:
    - port: 80
      targetPort: 8080

