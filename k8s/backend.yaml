apiVersion: v1
kind: ServiceAccount
metadata:
  name: storybook-backend
  namespace: default
  annotations:
    # Workload Identity — binds to the GCP SA created by Terraform
    iam.gke.io/gcp-service-account: storybook-backend@${GCP_PROJECT_ID}.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storybook-backend
  namespace: default
  labels:
    app: storybook-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storybook-backend
  template:
    metadata:
      labels:
        app: storybook-backend
    spec:
      serviceAccountName: storybook-backend
      containers:
        - name: backend
          image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/storybook-images/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: GCP_PROJECT_ID
              value: "${GCP_PROJECT_ID}"
            - name: GCP_REGION
              value: "${GCP_REGION}"
            - name: GCS_ARTIFACTS_BUCKET
              value: "${GCS_ARTIFACTS_BUCKET}"
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "1"
            - name: GOOGLE_CLOUD_PROJECT
              value: "${GCP_PROJECT_ID}"
            - name: GOOGLE_CLOUD_LOCATION
              value: "global"
            - name: RQLITE_URL
              value: "http://rqlite:4001"
            - name: SUBSTRATE_ENABLED
              value: "1"
            - name: SUBSTRATE_API_ADDR
              value: "api.ate-system.svc:443"
            - name: SUBSTRATE_ATESPACE
              value: "asp"
            - name: SUBSTRATE_TEMPLATE
              value: "asp-runner"
          volumeMounts:
            - name: ate-ca
              mountPath: /var/run/secrets/ate.dev/ca
              readOnly: true
            - name: client-cert
              mountPath: /var/run/secrets/ate.dev/client-cert
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: ate-ca
          configMap:
            name: ate-root-ca.crt
        - name: client-cert
          projected:
            sources:
              - podCertificate:
                  signerName: ate.dev/pod-identity
                  keyType: ECDSAP256
                  credentialBundlePath: tls-combined.pem
---
apiVersion: v1
kind: Service
metadata:
  name: storybook-backend
  namespace: default
  annotations:
    cloud.google.com/backend-config: '{"default": "storybook-backend-config"}'
spec:
  selector:
    app: storybook-backend
  ports:
    - port: 80
      targetPort: 8080
